<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="860" height="620" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">EBR-II 중간열교환기(IHX) 1D 대향류 노달라이제이션 (N = 20)</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#4b5563">기준: ANL-ARC-226 Rev.1 (5.2.7절, 표 5.2.7.1 p.128) | 노심 유효하단 z = 0 m 기준</text>

  <!-- Elevation ruler -->
  <line x1="95" y1="135" x2="95" y2="495" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="88" y1="135" x2="102" y2="135" stroke="#6b7280" stroke-width="1.5"/>
  <text x="82" y="139" text-anchor="end" font-size="11" fill="#374151">z = 5.369 m</text>
  <line x1="90" y1="185" x2="100" y2="185" stroke="#dc2626" stroke-width="1.5"/>
  <text x="82" y="189" text-anchor="end" font-size="11" fill="#dc2626">z = 4.939 m</text>
  <text x="82" y="318" text-anchor="end" font-size="11" font-weight="bold" fill="#111827">L = 3.137 m</text>
  <text x="82" y="334" text-anchor="end" font-size="10" fill="#4b5563">(Δz = 0.15685 m)</text>
  <line x1="88" y1="495" x2="102" y2="495" stroke="#6b7280" stroke-width="1.5"/>
  <text x="82" y="499" text-anchor="end" font-size="11" fill="#374151">z = 2.232 m</text>

  <!-- Secondary Upper Outlet Plenum -->
  <rect x="520" y="72" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="610" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">상부 출구 플레넘 CV-pl,out</text>
  <text x="610" y="105" text-anchor="middle" font-size="10" fill="#1e3a8a">V = 0.774 m³ (혼합지연 옵션)</text>
  <line x1="700" y1="92" x2="785" y2="92" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="790" y="88" font-size="11" font-weight="bold" fill="#1e40af">2차측 출구</text>
  <text x="790" y="103" font-size="10" fill="#1e3a8a">T2_out(t)</text>

  <!-- Column headers -->
  <text x="245" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">1차측 (쉘측 나트륨, 하향류)</text>
  <text x="430" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">304SS 전열관 벽 (3026본)</text>
  <text x="610" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">2차측 (튜브측 나트륨, 상향류)</text>

  <!-- Primary Z-pipe inlet arrow -->
  <line x1="115" y1="163" x2="173" y2="163" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="115" y="155" font-size="11" font-weight="bold" fill="#b91c1c">Z-pipe 유입</text>
  <text x="115" y="178" font-size="10" fill="#991b1b">T1_in, mdot1</text>

  <!-- Node j=1 -->
  <rect x="180" y="138" width="130" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CV-1,1 (T1,1)</text>
  <text x="245" y="176" text-anchor="middle" font-size="10" fill="#7f1d1d">z1 = 5.291 m</text>

  <rect x="375" y="138" width="110" height="50" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="430" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">HS-w,1 (Tw,1)</text>
  <text x="430" y="176" text-anchor="middle" font-size="10" fill="#4b5563">δw = 1.24 mm</text>

  <rect x="545" y="138" width="130" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CV-2,1 (T2,1)</text>
  <text x="610" y="176" text-anchor="middle" font-size="10" fill="#1e3a8a">고온단 (Pinch)</text>

  <line x1="610" y1="138" x2="610" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Heat transfer arrows j=1 -->
  <line x1="312" y1="163" x2="371" y2="163" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="342" y="156" text-anchor="middle" font-size="10" fill="#b45309">G1w,1</text>
  <line x1="487" y1="163" x2="541" y2="163" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="514" y="156" text-anchor="middle" font-size="10" fill="#b45309">Gw2,1</text>

  <!-- Flow arrows j=1 <-> j=2 -->
  <line x1="245" y1="188" x2="245" y2="210" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="610" y1="212" x2="610" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Node j=2 -->
  <rect x="180" y="213" width="130" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CV-1,2 (T1,2)</text>
  <text x="245" y="251" text-anchor="middle" font-size="10" fill="#7f1d1d">z2 = 5.134 m</text>

  <rect x="375" y="213" width="110" height="50" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="430" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">HS-w,2 (Tw,2)</text>
  <text x="430" y="251" text-anchor="middle" font-size="10" fill="#4b5563">Ao,j = 23.68 m²</text>

  <rect x="545" y="213" width="130" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CV-2,2 (T2,2)</text>
  <text x="610" y="251" text-anchor="middle" font-size="10" fill="#1e3a8a">Ai,j = 19.98 m²</text>

  <line x1="312" y1="238" x2="371" y2="238" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <line x1="487" y1="238" x2="541" y2="238" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>

  <!-- Ellipsis region j = 3 ... 18 -->
  <line x1="245" y1="263" x2="245" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="610" y1="292" x2="610" y2="266" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="180" y="295" width="495" height="52" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="430" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">중간 반복 노드: j = 3, 4, ..., 18 (총 20개 균일 분할, Δz = 0.15685 m)</text>
  <text x="430" y="336" text-anchor="middle" font-size="11" fill="#4b5563">1차측 A1 = 0.6354 m², Dh1 = 16.29 mm | 2차측 A2 = 0.4267 m², Dh2 = 13.40 mm</text>

  <line x1="245" y1="347" x2="245" y2="368" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="610" y1="370" x2="610" y2="350" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Node j=19 -->
  <rect x="180" y="370" width="130" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="391" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CV-1,19 (T1,19)</text>
  <text x="245" y="408" text-anchor="middle" font-size="10" fill="#7f1d1d">z19 = 2.467 m</text>

  <rect x="375" y="370" width="110" height="50" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="430" y="391" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">HS-w,19 (Tw,19)</text>
  <text x="430" y="408" text-anchor="middle" font-size="10" fill="#4b5563">반벽 전도 포함</text>

  <rect x="545" y="370" width="130" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="391" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CV-2,19 (T2,19)</text>
  <text x="610" y="408" text-anchor="middle" font-size="10" fill="#1e3a8a">상류 차분 수송</text>

  <line x1="312" y1="395" x2="371" y2="395" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <line x1="487" y1="395" x2="541" y2="395" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>

  <!-- Flow arrows j=19 <-> j=20 -->
  <line x1="245" y1="420" x2="245" y2="442" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="610" y1="444" x2="610" y2="423" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Node j=20 -->
  <rect x="180" y="445" width="130" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CV-1,20 (T1,20)</text>
  <text x="245" y="483" text-anchor="middle" font-size="10" fill="#7f1d1d">z20 = 2.310 m</text>

  <rect x="375" y="445" width="110" height="50" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="430" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">HS-w,20 (Tw,20)</text>
  <text x="430" y="483" text-anchor="middle" font-size="10" fill="#4b5563">rm = 7.294 mm</text>

  <rect x="545" y="445" width="130" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CV-2,20 (T2,20)</text>
  <text x="610" y="483" text-anchor="middle" font-size="10" fill="#1e3a8a">저온단 유입</text>

  <line x1="312" y1="470" x2="371" y2="470" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="342" y="463" text-anchor="middle" font-size="10" fill="#b45309">G1w,20</text>
  <line x1="487" y1="470" x2="541" y2="470" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="514" y="463" text-anchor="middle" font-size="10" fill="#b45309">Gw2,20</text>

  <!-- Primary Cold Pool outlet arrow -->
  <line x1="180" y1="470" x2="115" y2="470" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="115" y="458" font-size="11" font-weight="bold" fill="#b91c1c">저온풀 배출</text>
  <text x="115" y="486" font-size="10" fill="#991b1b">T1_out = T1,20</text>

  <!-- Secondary Lower Inlet Plenum -->
  <line x1="610" y1="525" x2="610" y2="498" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="520" y="525" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="610" y="543" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">하부 입구 플레넘 CV-pl,in</text>
  <text x="610" y="558" text-anchor="middle" font-size="10" fill="#1e3a8a">V = 0.774 m³ (중앙관 하강 후 180° 반전)</text>
  <line x1="785" y1="545" x2="704" y2="545" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="790" y="541" font-size="11" font-weight="bold" fill="#1e40af">2차측 입구 (CSV)</text>
  <text x="790" y="556" font-size="10" fill="#1e3a8a">T2_BC(t), mdot2(t)</text>

  <!-- Footer note -->
  <text x="430" y="598" text-anchor="middle" font-size="11" fill="#4b5563">상태변수 총 개수: 기본 3N = 60개 (T1,j, Tw,j, T2,j) + 플레넘 옵션 활성 시 2개 추가 = 62개</text>
</svg>
